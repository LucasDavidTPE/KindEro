[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kindero"
version = "0.1.0"
description = "Send Zotero papers to a Kindle and bring Kindle highlights back into Zotero, without jailbreak."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [{ name = "Lucas David" }]
dependencies = [
    "requests>=2.28",
    "pypdf>=4.0",
    "tomli>=2.0; python_version < '3.11'",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
kindero = "kindero.cli:main"

[project.urls]
Homepage = "https://github.com/LucasDavidTPE/KindEro"

[tool.setuptools.packages.find]
include = ["kindero*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
